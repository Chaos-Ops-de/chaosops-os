# ChaosOps OS - ISOLINUX menu for the i686 Legacy-BIOS / v86 ISO.
# Installed as isolinux/isolinux.cfg by Buildroot's fs/iso9660 target
# (BR2_TARGET_ROOTFS_ISO9660_BOOT_MENU). __KERNEL_PATH__ / __INITRD_PATH__
# are substituted for the real /boot/bzImage and /boot/initrd paths by
# fs/iso9660/iso9660.mk. The whole rootfs travels as the initrd, so there is
# no CD-ROM/root= dependency at runtime - it just needs to boot and unpack.
default chaosops
prompt 0
timeout 30

label chaosops
    kernel __KERNEL_PATH__
    initrd __INITRD_PATH__
    append vga=normal console=tty0 console=ttyS0,115200n8 quiet
