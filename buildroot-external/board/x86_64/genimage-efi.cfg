image efi-part.vfat {
	vfat {
		file EFI {
			image = "efi-part/EFI"
		}
		file bzImage {
			image = "bzImage"
		}
		# NOTE: the branded grub.cfg is NOT placed at the ESP root here — GRUB
		# only reads /EFI/BOOT/grub.cfg (prefix=/EFI/BOOT). post-image.sh writes
		# it there, inside the efi-part/EFI tree copied by "file EFI" above.
	}
	size = 32M
}

image chaosops-os-x86_64.img {
	hdimage {
		partition-table-type = "gpt"
	}
	partition boot {
		partition-type-uuid = c12a7328-f81f-11d2-ba4b-00a0c93ec93b
		image = "efi-part.vfat"
		bootable = "true"
	}
	partition root {
		partition-type-uuid = b921b045-1df0-41c3-af44-4c6f280d3fae
		partition-uuid = b921b045-1df0-41c3-af44-4c6f280d3f01
		image = "rootfs.ext4"
	}
}
