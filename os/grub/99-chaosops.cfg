# ChaosOps kiosk GRUB policy — installed to /etc/default/grub.d/99-chaosops.cfg.
# Applies when the image is installed to disk (grub-pc/grub-efi + update-grub).
# The live ISO/USB boot menu is hidden separately by image/build.sh
# (isolinux/grub-efi bootloader configs patched to timeout 0, no menu).

GRUB_DISTRIBUTOR="ChaosOps"
GRUB_TIMEOUT=0
GRUB_TIMEOUT_STYLE=hidden
GRUB_DISABLE_RECOVERY=true
GRUB_DISABLE_OS_PROBER=true
# quiet+splash → Plymouth owns the screen; loglevel=0 kills residual kernel text;
# vt.global_cursor_default=0 hides the blinking VT cursor before Plymouth starts.
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=0 rd.systemd.show_status=false vt.global_cursor_default=0 consoleblank=0"
# No editing/console escape from the (already hidden) menu.
GRUB_TERMINAL=console
