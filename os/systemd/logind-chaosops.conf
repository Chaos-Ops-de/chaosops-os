# Installed to /etc/systemd/logind.conf.d/chaosops.conf
# No spare virtual terminals: nothing to Ctrl-Alt-Fn into.
[Login]
NAutoVTs=0
ReserveVT=0
# Physical buttons must not drop the kiosk into unexpected states.
HandlePowerKey=poweroff
HandleSuspendKey=ignore
HandleHibernateKey=ignore
HandleLidSwitch=ignore
IdleAction=ignore
