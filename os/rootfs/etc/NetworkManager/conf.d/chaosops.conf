# NetworkManager owns all networking on ChaosOps OS (wifi-agent drives it via
# nmcli). Keep connection profiles in NM's own keyfile store so they survive
# reboots, and don't let NM randomise the MAC while scanning — some captive
# office networks pin devices by MAC.
[main]
plugins=keyfile
dns=default

[device]
wifi.scan-rand-mac-address=no
