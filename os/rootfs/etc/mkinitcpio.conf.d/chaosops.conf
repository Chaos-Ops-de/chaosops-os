# Generic (host-independent) systemd initramfs with the ChaosOps splash.
#
# No `autodetect`: the image is built in a chroot, so autodetect would only
# pack the build machine's drivers. No `kms` either: without autodetect it
# packs every GPU driver plus ~180 MB of GPU firmware (NVIDIA alone ~105 MB)
# into every boot. Plymouth starts on simpledrm (the UEFI / Pi firmware
# framebuffer) and moves to the native GPU driver once it loads from the root
# filesystem, so the splash still shows from early boot.
HOOKS=(base systemd plymouth modconf keyboard block filesystems fsck)
COMPRESSION="zstd"
