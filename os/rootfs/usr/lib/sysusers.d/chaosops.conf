# ChaosOps OS service users (applied by systemd-sysusers at build + boot).
#
# chaosops-agent: runs wifi-agent + hotkeyd. Drives NetworkManager only via the
#                 polkit rule in /etc/polkit-1/rules.d/50-chaosops-nm.rules.
# kiosk:          owns the cage/Chromium session on tty1. No shell, no password,
#                 no network privileges.
u chaosops-agent - "ChaosOps agent" /var/lib/chaosops /usr/bin/nologin
m chaosops-agent input
u kiosk          - "ChaosOps kiosk" /var/lib/chaosops-kiosk /usr/bin/nologin
m kiosk video
m kiosk render
m kiosk input
