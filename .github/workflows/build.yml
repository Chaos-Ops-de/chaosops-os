name: Build ChaosOps OS images

on:
  push:
    branches: [main]
    paths:
      - 'buildroot-external/**'
      - '.github/workflows/build.yml'
  workflow_dispatch: {}

env:
  BUILDROOT_REF: '2024.02.9'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64            # ThinkCentre / NUC / generic Intel-AMD mini-PC (UEFI)
            base: chaosops_x86_64_defconfig
            image: chaosops-os-x86_64.img
          - name: rpi4-64           # Raspberry Pi 4 / 400 (aarch64)
            base: raspberrypi4_64_defconfig
            image: sdcard.img
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Install Buildroot host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git wget cpio unzip rsync bc file \
            libncurses-dev python3 ccache dosfstools mtools \
            libelf-dev libssl-dev flex bison
          # libelf-dev: x86-64 kernel builds tools/objtool (ORC unwinder) which
          #   needs <gelf.h>; without it the build dies at 'fatal error: gelf.h'.
          # libssl-dev/flex/bison: standard Linux kernel host-build deps.

      - name: Fetch Buildroot ${{ env.BUILDROOT_REF }}
        run: |
          git clone --depth 1 --branch "$BUILDROOT_REF" \
            https://gitlab.com/buildroot.org/buildroot.git buildroot
          echo "BR2_EXTERNAL=$GITHUB_WORKSPACE/buildroot-external" >> "$GITHUB_ENV"

      - name: Cache downloads + ccache
        uses: actions/cache@v4
        with:
          path: |
            buildroot/dl
            ~/.buildroot-ccache
          key: br-${{ env.BUILDROOT_REF }}-${{ matrix.name }}-${{ hashFiles('buildroot-external/configs/*') }}
          restore-keys: |
            br-${{ env.BUILDROOT_REF }}-${{ matrix.name }}-

      - name: Configure (${{ matrix.name }})
        working-directory: buildroot
        run: |
          make BR2_EXTERNAL="$BR2_EXTERNAL" ${{ matrix.base }}
          # Merge the shared ChaosOps userspace/branding fragment on top.
          ./support/kconfig/merge_config.sh -m -O . .config \
            "$BR2_EXTERNAL/configs/chaosops.frag"
          make BR2_EXTERNAL="$BR2_EXTERNAL" olddefconfig

      - name: Build (${{ matrix.name }})
        working-directory: buildroot
        run: make BR2_EXTERNAL="$BR2_EXTERNAL" BR2_JLEVEL=$(( $(nproc) + 1 ))

      - name: Show images
        run: ls -lh buildroot/output/images/

      - name: Upload image (${{ matrix.name }})
        uses: actions/upload-artifact@v4
        with:
          name: chaosops-os-${{ matrix.name }}
          path: buildroot/output/images/${{ matrix.image }}
          if-no-files-found: error
          compression-level: 6
