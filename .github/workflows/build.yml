name: Build ChaosOps OS images

on:
  push:
    branches: [main]
    paths:
      - 'os/**'
      - 'image/**'
      - 'wifi-agent/src/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'os/**'
      - 'image/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      arch_snapshot:
        description: 'Arch Linux Archive date (YYYY/MM/DD) for a reproducible x86_64 build; empty = live mirrors'
        required: false
        default: ''

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  agent-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: wifi-agent

  # Runs in parallel with agent-test; only the release waits for both.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: x86_64          # NUC / ThinkCentre / generic Intel-AMD mini-PC (UEFI)
            runner: ubuntu-24.04
          - board: rpi4-aarch64    # Raspberry Pi 4 / 400 (Arch Linux ARM)
            runner: ubuntu-24.04-arm   # native arm64: no qemu emulation needed
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      WORK: ${{ github.workspace }}/.work/${{ matrix.board }}
      PKGCACHE: ${{ github.workspace }}/.work/pkg-${{ matrix.board }}
      OUT: ${{ github.workspace }}/out
      ARCH_SNAPSHOT: ${{ inputs.arch_snapshot }}
    steps:
      - uses: actions/checkout@v4

      - name: Install builder dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            arch-install-scripts libarchive-tools curl zstd \
            fdisk e2fsprogs dosfstools mtools

      - name: Cache key (ISO week)
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      # Packages + base tarballs. pacman verifies every package and build.sh
      # checksums the tarballs, so a stale cache only costs disk, never
      # correctness. Re-keyed weekly so it tracks the rolling repos.
      - name: Cache packages + base tarballs
        uses: actions/cache@v4
        with:
          path: |
            .work/pkg-${{ matrix.board }}
            .work/downloads
          key: pacman-${{ matrix.board }}-${{ steps.week.outputs.week }}
          restore-keys: pacman-${{ matrix.board }}-

      - name: Build image (${{ matrix.board }})
        run: |
          sudo --preserve-env=WORK,PKGCACHE,OUT,ARCH_SNAPSHOT \
            CHAOSOPS_VERSION="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" \
            image/build.sh ${{ matrix.board }}
          sudo chown -R "$(id -u):$(id -g)" .work/pkg-${{ matrix.board }} .work/downloads out

      # zstd -10 on 4 cores: ~17 s for ~810 MB, vs ~4 min for xz -6 (~650 MB).
      # Raspberry Pi Imager reads .img.zst directly; for dd:
      #   zstd -dc chaosops-os-<board>.img.zst | sudo dd of=/dev/sdX bs=4M
      - name: Compress
        run: zstd -T0 -10 --rm out/chaosops-os-${{ matrix.board }}.img

      - uses: actions/upload-artifact@v4
        with:
          name: chaosops-os-${{ matrix.board }}
          path: out/chaosops-os-${{ matrix.board }}.img.zst
          if-no-files-found: error
          compression-level: 0   # already zstd
          retention-days: 14     # releases keep main's images; PR builds are throwaway

  release:
    needs: [agent-test, build]
    runs-on: ubuntu-24.04
    # Only main mints releases; branches/PRs just upload artifacts for testing.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: chaosops-os-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ChaosOps OS build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: release/*.img.zst
          generate_release_notes: true
