name: Build ChaosOps OS images

on:
  push:
    branches: [main]
    paths:
      - 'buildroot-external/**'
      - '.github/workflows/build.yml'
  workflow_dispatch: {}

env:
  BUILDROOT_REF: '2024.02.9'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64            # ThinkCentre / NUC / generic Intel-AMD mini-PC (UEFI)
            base: chaosops_x86_64_defconfig
            build_image: chaosops-os-x86_64.img
            release_image: chaosops-os-x86_64.img
            legacy_iso: rootfs.iso9660   # ISOLINUX/El-Torito hybrid ISO: Legacy BIOS + v86
            legacy_name: chaosops-os-x86_64-legacy.iso
          - name: rpi4-64           # Raspberry Pi 4 / 400 (aarch64)
            base: raspberrypi4_64_defconfig
            build_image: sdcard.img
            release_image: chaosops-os-rpi4-64.img
            legacy_iso: ''
            legacy_name: ''
          - name: i686              # 32-bit Legacy-BIOS + browser emulators (v86 - copy.sh/v86
            base: chaosops_i686_defconfig      # only supports 32-bit protected mode, no x86_64)
            build_image: rootfs.iso9660
            release_image: chaosops-os-i686-legacy.iso
            legacy_iso: ''
            legacy_name: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Install Buildroot host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git wget cpio unzip rsync bc file \
            libncurses-dev python3 ccache dosfstools mtools \
            libelf-dev libssl-dev flex bison
          # libelf-dev: x86-64 kernel builds tools/objtool (ORC unwinder) which
          #   needs <gelf.h>; without it the build dies at 'fatal error: gelf.h'.
          # libssl-dev/flex/bison: standard Linux kernel host-build deps.

      - name: Fetch Buildroot ${{ env.BUILDROOT_REF }}
        run: |
          git clone --depth 1 --branch "$BUILDROOT_REF" \
            https://gitlab.com/buildroot.org/buildroot.git buildroot
          echo "BR2_EXTERNAL=$GITHUB_WORKSPACE/buildroot-external" >> "$GITHUB_ENV"

      - name: Cache downloads + ccache
        uses: actions/cache@v4
        with:
          path: |
            buildroot/dl
            ~/.buildroot-ccache
          key: br-${{ env.BUILDROOT_REF }}-${{ matrix.name }}-${{ hashFiles('buildroot-external/configs/*') }}
          restore-keys: |
            br-${{ env.BUILDROOT_REF }}-${{ matrix.name }}-

      - name: Configure (${{ matrix.name }})
        working-directory: buildroot
        run: |
          make BR2_EXTERNAL="$BR2_EXTERNAL" ${{ matrix.base }}
          # Merge the shared ChaosOps userspace/branding fragment on top.
          ./support/kconfig/merge_config.sh -m -O . .config \
            "$BR2_EXTERNAL/configs/chaosops.frag"
          make BR2_EXTERNAL="$BR2_EXTERNAL" olddefconfig

      - name: Build (${{ matrix.name }})
        working-directory: buildroot
        run: make BR2_EXTERNAL="$BR2_EXTERNAL" BR2_JLEVEL=$(( $(nproc) + 1 ))

      - name: Show images
        run: ls -lh buildroot/output/images/

      - name: Rename image (${{ matrix.name }})
        run: |
          src="buildroot/output/images/${{ matrix.build_image }}"
          dst="buildroot/output/images/${{ matrix.release_image }}"
          # build_image == release_image for some targets; cp refuses a
          # same-file copy, so only copy when the names actually differ.
          [ "$src" = "$dst" ] || cp "$src" "$dst"

      - name: Rename Legacy-BIOS/v86 ISO (${{ matrix.name }})
        if: matrix.legacy_iso != ''
        run: |
          src="buildroot/output/images/${{ matrix.legacy_iso }}"
          dst="buildroot/output/images/${{ matrix.legacy_name }}"
          [ "$src" = "$dst" ] || cp "$src" "$dst"

      - name: Upload image (${{ matrix.name }})
        uses: actions/upload-artifact@v4
        with:
          name: chaosops-os-${{ matrix.name }}
          path: buildroot/output/images/${{ matrix.release_image }}
          if-no-files-found: error
          compression-level: 6

      - name: Upload Legacy-BIOS/v86 ISO (${{ matrix.name }})
        if: matrix.legacy_iso != ''
        uses: actions/upload-artifact@v4
        with:
          name: chaosops-os-${{ matrix.name }}-legacy
          path: buildroot/output/images/${{ matrix.legacy_name }}
          if-no-files-found: error
          compression-level: 6

  release:
    needs: build
    runs-on: ubuntu-latest
    # Only publish a GitHub Release from main — branch/feature dispatches build
    # + upload artifacts for testing but must not mint release tags.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    steps:
      - name: Download built images
        uses: actions/download-artifact@v4
        with:
          path: images
          pattern: chaosops-os-*
          merge-multiple: false

      - name: Flatten and rename images
        run: |
          mkdir -p release
          for dir in images/*/; do
            name=$(basename "$dir")
            file=$(find "$dir" -type f | head -n1)
            ext="${file##*.}"
            cp "$file" "release/${name}.${ext}"
          done
          ls -lh release/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ChaosOps OS build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: release/*
          generate_release_notes: true
